      parameters:
      - description: Start time (ISO-8601 format), e.g. 2026-03-01T00:00:00Z
        in: query
        name: from_created_at
        required: true
        type: string
      - description: End time (ISO-8601 format, must be greater than from_created_at
          and within 7 days), e.g. 2026-03-05T00:00:00Z
        in: query
        name: to_created_at
        required: true
        type: string
      - description: CPO client ID, e.g. JTHBN30F2100104330
        in: query
        name: client_id
        type: string
      - description: Car ID (evccid), e.g. f0fddd00f2fe
        in: query
        name: car_id
        type: string
