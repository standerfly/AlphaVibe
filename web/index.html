<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaVibe</title>
    <script>
      /* 2026-08-22 新增：在 React 掛載前先套用存好的主題選擇，避免深色
         模式使用者一開始先閃一下淺色畫面。邏輯要跟 src/theme.js 的
         applyTheme() 保持一致，改動其中一邊記得同步另一邊。 */
      (function () {
        try {
          var t = localStorage.getItem('alphavibe-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
