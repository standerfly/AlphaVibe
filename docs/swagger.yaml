        in: query
        name: request_id
        type: string
      - description: VIN, e.g. RF5D21FH0SS000513
        in: query
        name: vin
        type: string
      - description: Order status filter, e.g. 6
        in: query
        name: order_status
        type: integer
      - description: Payment status filter, e.g. 4
        in: query
        name: payment_status
        type: integer
      - description: Invoice status filter, e.g. 3
        in: query
        name: invoice_status
        type: integer
      - default: 1
        description: 'Page number (default: 1), e.g. 1'
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
